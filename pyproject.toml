[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opusvideo"
version = "0.1.0"
description = "A Claude-powered crew that turns a premise into a short comedy video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.17",
    "pydantic>=2.7",
    "pillow>=10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opusvideo = "opusvideo.cli:main"

[tool.setuptools.packages.find]
include = ["opusvideo*"]
